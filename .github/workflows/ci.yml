name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint backend
        run: ruff check .

      - name: Test backend
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-only-secret
          DEFAULT_ADMIN_EMAIL: admin@example.com
          DEFAULT_ADMIN_PASSWORD: AdminPass123!
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  docs-and-sample-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate evaluation dataset
        run: python scripts/evaluation_placeholder.py --dataset sample-data/evaluation/questions.json

      - name: Check documentation links are present
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/security-model.md
          test -f docs/eu-ai-governance.md
          test -f sample-data/README.md
